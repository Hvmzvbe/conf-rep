# API Gateway Configuration
server.port=8083

# Route Timeouts
spring.cloud.gateway.httpclient.connect-timeout=5000
spring.cloud.gateway.httpclient.response-timeout=10000ms

# Service Routes
spring.cloud.gateway.routes[0].id=ms-patients
spring.cloud.gateway.routes[0].uri=lb://ms-patients
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/patients/**,/api/dossiers/**,/api/health
spring.cloud.gateway.routes[0].filters[0]=StripPrefix=0

spring.cloud.gateway.routes[1].id=appointments-service
spring.cloud.gateway.routes[1].uri=lb://appointments-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/appointments/**,/api/doctors/**
spring.cloud.gateway.routes[1].filters[0]=StripPrefix=0

# JWT
jwt.enabled=true
jwt.secret=medical_secret_key

# CORS Configuration
spring.webflux.cors.allowed-origins=http://localhost:4200,http://localhost:3000
spring.webflux.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
spring.webflux.cors.allowed-headers=*
spring.webflux.cors.allow-credentials=true