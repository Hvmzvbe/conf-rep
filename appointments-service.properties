# Configuration du serveur
server.port=8082

# Configuration Base de Données (PostgreSQL)
spring.datasource.url=jdbc:postgresql://localhost:5432/healthcare_appointments
spring.datasource.username=postgres
spring.datasource.password=1234567
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuration JPA / Hibernate pour PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true



# Eureka Client
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# Monitoring (Actuator)
management.endpoints.web.exposure.include=health,info,metrics,env
management.endpoint.health.show-details=always

# Config personnalisée (Valeur par défaut avant externalisation)
mes-config-ms.appointments-last=30
